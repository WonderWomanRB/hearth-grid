# Office Panel Dashboards
#
# Room-scoped dashboard for individual office spaces.
# Shows room climate, lighting, and quick home status overview.
#
# Displays: 10" Raspberry Pi (per office)

title: Office Control
icon: mdi:home
path: office

views:
  # ---------------------------------------------------------
  # CLIMATE VIEW
  # ---------------------------------------------------------
  - path: climate
    title: Climate
    icon: mdi:thermometer
    cards:
      - type: title
        title: Office Climate

      - type: grid
        square: false
        columns: 1
        cards:
          # Thermostat Control
          - type: thermostat
            entity: climate.office_thermostat
            name: Office Climate

          # Temperature Details
          - type: entities
            state_color: true
            entities:
              - entity: sensor.office_temperature
                name: Current Temperature
              - entity: sensor.office_humidity
                name: Humidity
              - entity: sensor.office_thermostat_setpoint
                name: Setpoint
              - entity: sensor.office_hvac_status
                name: System Status

          # Quick Adjust Buttons
          - type: horizontal-stack
            cards:
              - type: button
                name: Cooler
                icon: mdi:minus-circle
                tap_action:
                  action: call-service
                  service: climate.set_temperature
                  service_data:
                    entity_id: climate.office_thermostat
                    temperature: >
                      {{ (state_attr('climate.office_thermostat', 'current_temperature') - 1) | round(1) }}

              - type: button
                name: Warmer
                icon: mdi:plus-circle
                tap_action:
                  action: call-service
                  service: climate.set_temperature
                  service_data:
                    entity_id: climate.office_thermostat
                    temperature: >
                      {{ (state_attr('climate.office_thermostat', 'current_temperature') + 1) | round(1) }}

      # Navigation Buttons
      - type: horizontal-stack
        cards:
          - type: button
            name: Lighting
            icon: mdi:lightbulb
            tap_action:
              action: navigate
              navigation_path: /office/lighting
          - type: button
            name: Home Status
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /office/home-status

  # ---------------------------------------------------------
  # LIGHTING VIEW
  # ---------------------------------------------------------
  - path: lighting
    title: Lighting
    icon: mdi:lightbulb
    cards:
      - type: title
        title: Office Lighting

      - type: grid
        square: false
        columns: 1
        cards:
          # Desk Light
          - type: custom:stack-in-card
            cards:
              - type: title
                title: Desk Light
              - type: light
                entity: light.office_desk
                show_state: true

          # Ceiling Light
          - type: custom:stack-in-card
            cards:
              - type: title
                title: Ceiling Light
              - type: light
                entity: light.office_ceiling
                show_state: true

          # Scenes / Presets
          - type: horizontal-stack
            cards:
              - type: button
                name: Work Mode
                icon: mdi:briefcase
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.office_work

              - type: button
                name: Relax Mode
                icon: mdi:armchair
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.office_relax

      # Navigation Buttons
      - type: horizontal-stack
        cards:
          - type: button
            name: Climate
            icon: mdi:thermometer
            tap_action:
              action: navigate
              navigation_path: /office/climate
          - type: button
            name: Home Status
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /office/home-status

  # ---------------------------------------------------------
  # HOME STATUS VIEW
  # ---------------------------------------------------------
  - path: home-status
    title: Home Status
    icon: mdi:home
    cards:
      - type: title
        title: Quick Home Status

      - type: grid
        square: false
        columns: 1
        cards:
          # Dexcom Status
          - type: custom:stack-in-card
            cards:
              - type: title
                title: Dad's Health
              - type: gauge
                entity: sensor.dexcom_glucose
                min: 50
                max: 300
                segments:
                  - from: 50
                    to: 70
                    color: red
                  - from: 70
                    to: 180
                    color: green
                  - from: 180
                    to: 300
                    color: orange
              - type: entities
                entities:
                  - entity: sensor.dexcom_glucose_trend
                  - entity: sensor.dexcom_last_reading_time

          # Security Status
          - type: custom:stack-in-card
            cards:
              - type: title
                title: Security
              - type: entities
                state_color: true
                entities:
                  - entity: lock.front_door
                    name: Front Door
                  - entity: lock.back_door
                    name: Back Door
                  - entity: cover.front_gate
                    name: Gate
                  - entity: cover.garage_door
                    name: Garage

          # Quick Alerts
          - type: custom:stack-in-card
            cards:
              - type: title
                title: Recent Alerts
              - type: entities
                entities:
                  - entity: sensor.last_important_notification
                  - entity: sensor.gate_activity_summary

          # Link to Full Dashboard
          - type: button
            name: View Full Dashboard
            icon: mdi:arrow-right-bold
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/overview

      # Navigation Buttons
      - type: horizontal-stack
        cards:
          - type: button
            name: Climate
            icon: mdi:thermometer
            tap_action:
              action: navigate
              navigation_path: /office/climate
          - type: button
            name: Lighting
            icon: mdi:lightbulb
            tap_action:
              action: navigate
              navigation_path: /office/lighting
