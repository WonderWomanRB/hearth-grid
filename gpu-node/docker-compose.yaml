version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    environment:
      - OLLAMA_NUM_GPU=1

  yolo-api:
    image: ghcr.io/ultralytics/yolo:latest
    container_name: yolo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/yolo:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    environment:
      - YOLO_MODEL=yolov8n.pt

networks:
  default:
    name: gpu-node-net
